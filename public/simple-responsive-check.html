<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive preview</title>
<style>body{margin:0;padding:16px;font:16px system-ui;background:#eef1f0;color:#172b3b}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}button,select{font:inherit;padding:7px 12px}iframe{display:block;border:1px solid #bdc8c5;background:white;max-width:none;height:calc(100vh - 104px)}.size{margin:0 0 12px}</style></head>
<body><nav aria-label="Preview controls"><button data-width="360">360px phone</button><button data-width="390">390px phone</button><button data-width="768">Tablet</button><button data-width="1100">Laptop</button><select aria-label="Page"><option value="/">Home</option><option value="/start-here/">Start here</option><option value="/blog/">Articles</option><option value="/blog/what-you-own-in-an-etf/">ETF article</option><option value="/blog/the-quiet-work-of-compounding/">Image and GIF article</option><option value="/coast-fire/" selected>Coast FIRE</option><option value="/coast-fire/#coast-chart-title">Graph</option><option value="/zh/coast-fire/">Chinese calculator</option><option value="/ms/coast-fire/">Malay calculator</option><option value="/about/">About</option></select></nav><p class="size">Preview at <span>390</span>px</p><iframe id="site-preview" title="Responsive site preview" src="/coast-fire/" style="width:390px"></iframe>
<script>const f=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{f.style.width=b.dataset.width+'px';document.querySelector('.size span').textContent=b.dataset.width}));document.querySelector('select').addEventListener('change',e=>f.src=e.target.value);</script></body></html>
